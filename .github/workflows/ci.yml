name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_RELEASE: openwrt-24.10
  FEEDNAME: ladderairport
  PACKAGES: ladder-agent luci-app-ladder-agent

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Common OpenWrt targets: arm64, arm, mipsel, x86_64
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - arm_cortex-a7
          - arm_cortex-a9
          - mipsel_24kc
          - x86_64

    steps:
      - name: Checkout OpenWrt feed
        uses: actions/checkout@v4
        with:
          path: feed
          fetch-depth: 0
          # LadderAirport is a git submodule of this feed; nested sing-box/frp
          # needed for build. Skip sing-box clients/* (android/apple) below.
          submodules: false

      - name: Init LadderAirport submodule (agent deps only)
        working-directory: feed
        run: |
          set -euo pipefail
          git submodule update --init LadderAirport
          git -C LadderAirport submodule update --init agent/frp agent/sing-box
          test -f LadderAirport/agent/go.mod
          test -d LadderAirport/agent/sing-box
          test -d LadderAirport/agent/frp

      - name: Resolve package version
        id: ver
        working-directory: feed
        run: |
          VER="$(git -C LadderAirport describe --tags --always 2>/dev/null | sed 's/^v//' | tr '_' '-')"
          echo "pkg_version=${VER:-0.0.0-ci}" >> "$GITHUB_OUTPUT"
          echo "Building ladder-agent PKG_VERSION=${VER:-0.0.0-ci} arch=${{ matrix.arch }}"
          echo "LadderAirport=$(git -C LadderAirport rev-parse --short HEAD)"

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_RELEASE }}
          FEED_DIR: ${{ github.workspace }}/feed
          FEEDNAME: ${{ env.FEEDNAME }}
          PACKAGES: ${{ env.PACKAGES }}
          INDEX: 1
          V: s
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1
          PKG_VERSION: ${{ steps.ver.outputs.pkg_version }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ladder-agent-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/${{ env.FEEDNAME }}/
          if-no-files-found: error
          retention-days: 14
