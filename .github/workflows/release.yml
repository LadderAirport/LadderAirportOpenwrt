name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openwrt-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_RELEASE: openwrt-24.10
  FEEDNAME: ladderairport
  PACKAGES: ladder-agent luci-app-ladder-agent

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Common OpenWrt targets: arm64, arm, mipsel, x86_64
        arch:
          - aarch64_cortex-a53
          - aarch64_generic
          - arm_cortex-a7
          - arm_cortex-a9
          - mipsel_24kc
          - x86_64

    steps:
      - name: Checkout OpenWrt feed
        uses: actions/checkout@v4
        with:
          path: feed
          fetch-depth: 0
          submodules: false

      - name: Init LadderAirport submodule (agent deps only)
        working-directory: feed
        run: |
          set -euo pipefail
          git submodule update --init LadderAirport
          git -C LadderAirport submodule update --init agent/frp agent/sing-box
          test -f LadderAirport/agent/go.mod
          test -d LadderAirport/agent/sing-box
          test -d LadderAirport/agent/frp

      - name: Resolve package version
        id: ver
        working-directory: feed
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(git -C LadderAirport describe --tags --always 2>/dev/null | sed 's/^v//' | tr '_' '-')"
          fi
          echo "pkg_version=${VER:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "LadderAirport=$(git -C LadderAirport rev-parse --short HEAD)"

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ env.OPENWRT_RELEASE }}
          FEED_DIR: ${{ github.workspace }}/feed
          FEEDNAME: ${{ env.FEEDNAME }}
          PACKAGES: ${{ env.PACKAGES }}
          INDEX: 1
          V: s
          NO_SHFMT_CHECK: 1
          NO_REFRESH_CHECK: 1
          PKG_VERSION: ${{ steps.ver.outputs.pkg_version }}
          KEY_BUILD: ${{ secrets.KEY_BUILD }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ladder-agent-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/${{ env.FEEDNAME }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Aggregate feed and release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble feed tree
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/ladder-agent-*; do
            [ -d "$dir" ] || continue
            arch="${dir#artifacts/ladder-agent-}"
            mkdir -p "dist/${arch}/${FEEDNAME}"
            cp -a "$dir"/. "dist/${arch}/${FEEDNAME}/"
            echo "Assembled ${arch}: $(ls -1 "dist/${arch}/${FEEDNAME}" | wc -l) files"
          done
          cd dist
          find . -type f | sort > ../MANIFEST.txt
          tar -czf ../ladderairport-openwrt-feed.tar.gz .
          cd ..
          sha256sum ladderairport-openwrt-feed.tar.gz MANIFEST.txt > SHA256SUMS.txt
          mkdir -p per-arch
          for archdir in dist/*; do
            [ -d "$archdir" ] || continue
            arch="$(basename "$archdir")"
            tar -czf "per-arch/${arch}.tar.gz" -C "dist/${arch}" .
          done
          ls -la dist per-arch ladderairport-openwrt-feed.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ladderairport-openwrt-feed.tar.gz
            SHA256SUMS.txt
            MANIFEST.txt
            per-arch/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
